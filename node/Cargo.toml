[package]
name = "sluicify-node"
version = "0.2.2"
edition = "2021"
authors = ["Christophe Le Bars <clb@toort.net>"]
description = "Native Node.js addon for the sluicify command broker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/clbrge/sluicify"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", default-features = false, features = ["napi6"] }
napi-derive = "2"
nix         = { version = "0.29", features = ["socket", "uio"] }
sluicify    = { path = ".." }

[build-dependencies]
napi-build = "=2.2.0"  # newer requires rustc 1.88

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
