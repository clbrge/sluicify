name: Publish sluicify-native

on:
  release:
    types: [created]

# `id-token: write` is required for npm trusted publishing via GitHub
# OIDC (https://docs.npmjs.com/trusted-publishers).
permissions:
  contents: read
  id-token: write

jobs:
  native:
    # One addon per architecture, each built and smoke-tested on a runner of
    # that architecture. Pinned: the .node links against the runner's glibc,
    # which must not be newer than the hosts' (Debian 13).
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Third-party actions are pinned to full commit SHAs.
      # dtolnay/rust-toolchain@stable as of 2026-08-05
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build the addon
        working-directory: node
        run: |
          set -euo pipefail
          [ "$(node -p process.arch)" = "${{ matrix.arch }}" ] || { echo "::error::this runner is $(node -p process.arch), not ${{ matrix.arch }}"; exit 1; }
          cargo build --release --locked
          cp target/release/libsluicify_node.so sluicify-native.linux-${{ matrix.arch }}-gnu.node

      - name: Smoke test against a live broker
        run: |
          cargo build --release --locked --bin sluice
          node node/test/smoke.js

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch }}
          path: node/sluicify-native.linux-${{ matrix.arch }}-gnu.node
          if-no-files-found: error

  publish:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5.1 for OIDC; npm 12 breaks `publish --provenance`.
      - name: Upgrade npm to OIDC-capable version
        run: npm install -g npm@11

      - name: Check package version matches the release tag
        working-directory: node
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::node/package.json $PKG does not match release tag v$TAG"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: node

      - name: Check both addons are in the package
        working-directory: node
        run: |
          set -euo pipefail
          packed=$(npm pack --dry-run --json --ignore-scripts | node -p "JSON.parse(require('fs').readFileSync(0)).flatMap(p => p.files.map(f => f.path)).join('\n')")
          for arch in x64 arm64; do
            echo "$packed" | grep -qx "sluicify-native.linux-$arch-gnu.node" || { echo "::error::sluicify-native.linux-$arch-gnu.node is not in the package"; exit 1; }
          done

      - name: Publish
        working-directory: node
        run: npm publish --provenance --access public
