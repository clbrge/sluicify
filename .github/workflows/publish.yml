name: Publish sluicify-native

on:
  release:
    types: [created]

# `id-token: write` is required for npm trusted publishing via GitHub
# OIDC (https://docs.npmjs.com/trusted-publishers).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5.1 for OIDC; npm 12 breaks `publish --provenance`.
      - name: Upgrade npm to OIDC-capable version
        run: npm install -g npm@11

      # Third-party actions are pinned to full commit SHAs: this job holds
      # `id-token: write`. dtolnay/rust-toolchain@stable as of 2026-08-05
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Check package version matches the release tag
        working-directory: node
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(node -p "require('./package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::node/package.json $PKG does not match release tag v$TAG"
            exit 1
          fi

      - name: Build the addon
        working-directory: node
        run: |
          cargo build --release --locked
          cp target/release/libsluicify_node.so sluicify-native.linux-x64-gnu.node

      - name: Smoke test against a live broker
        run: |
          cargo build --release --locked --bin sluice
          node node/test/smoke.js

      - name: Publish
        working-directory: node
        run: npm publish --provenance --access public
